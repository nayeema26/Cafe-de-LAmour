{% extends "base.html" %}
{% block title %}{{ title }} · Café de L'Amour{% endblock %}
{% block content %}<div class="form-shell"><div class="page-head"><h1>{{ title }}</h1><a href="{{ url_for('category_list') }}">← Back</a></div><form class="panel" method="post"><label>Category name</label><input required class="form-control mb-3" name="name" value="{{ category.name|default('') }}"><label>Description</label><textarea class="form-control" rows="4" name="description">{{ category.description|default('') }}</textarea><button class="btn btn-cocoa mt-4">Save Category</button></form></div>{% endblock %}
