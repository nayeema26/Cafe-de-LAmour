{% extends "base.html" %}
{% block title %}Categories · Café de L'Amour{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">ORGANISE</p><h1>Categories</h1></div><a href="{{ url_for('category_add') }}" class="btn btn-cocoa">+ Add Category</a></div>
<div class="row g-3">{% for c in categories %}<div class="col-md-6 col-lg-4"><div class="panel h-100"><h3>{{ c.name }}</h3><p class="text-muted">{{ c.description }}</p><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-cocoa" href="{{ url_for('category_edit', id=c._id) }}">Edit</a><form method="post" action="{{ url_for('category_delete', id=c._id) }}" onsubmit="return confirmDelete('this category')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></div></div></div>{% else %}<div class="col-12"><div class="empty-state">No categories yet.</div></div>{% endfor %}</div>
{% endblock %}
