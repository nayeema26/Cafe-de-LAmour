{% extends "base.html" %}
{% block title %}{{ title }} · Café de L'Amour{% endblock %}
{% block content %}
<div class="form-shell"><div class="page-head"><h1>{{ title }}</h1><a href="{{ url_for('menu') }}">← Back</a></div>
<form class="panel" method="post">
  <div class="row g-3">
    <div class="col-md-8"><label>Name</label><input required class="form-control" name="name" value="{{ item.name|default('') }}"></div>
    <div class="col-md-4"><label>Price (₹)</label><input required min="0.01" step="0.01" type="number" class="form-control" name="price" value="{{ item.price|default('') }}"></div>
    <div class="col-md-6"><label>Category</label><select required class="form-select" name="category">{% for c in categories %}<option {% if item.category|default('')==c.name %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label>Image URL (optional)</label><input class="form-control" name="image_url" value="{{ item.image_url|default('') }}"></div>
    <div class="col-12"><label>Description</label><textarea class="form-control" rows="4" name="description">{{ item.description|default('') }}</textarea></div>
    <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="available" {% if item.available|default(true) %}checked{% endif %}><label class="form-check-label">Available</label></div>
  </div>
  <button class="btn btn-cocoa mt-4">Save Item</button>
</form></div>
{% endblock %}
