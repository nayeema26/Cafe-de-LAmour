{% extends "base.html" %}
{% block title %}{{ title }} · Café de L'Amour{% endblock %}
{% block content %}<div class="form-shell"><div class="page-head"><h1>{{ title }}</h1><a href="{{ url_for('customer_list') }}">← Back</a></div><form class="panel" method="post"><div class="row g-3"><div class="col-md-6"><label>Full name</label><input required class="form-control" name="name" value="{{ customer.name|default('') }}"></div><div class="col-md-6"><label>Email</label><input required type="email" class="form-control" name="email" value="{{ customer.email|default('') }}"></div><div class="col-md-6"><label>Phone</label><input required pattern="[0-9+\-\s]{7,20}" class="form-control" name="phone" value="{{ customer.phone|default('') }}"></div><div class="col-12"><label>Address</label><textarea class="form-control" name="address">{{ customer.address|default('') }}</textarea></div></div><button class="btn btn-cocoa mt-4">Save Customer</button></form></div>{% endblock %}
